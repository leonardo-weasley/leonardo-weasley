<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" role="img" aria-label="卡通篮球小子运球">
  <defs>
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#F97316"/>
    </radialGradient>

    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F2F2"/>
    </linearGradient>
  </defs>

  <!-- 地面阴影 -->
  <ellipse cx="160" cy="212" rx="118" ry="16" fill="#000" opacity="0.07"/>

  <!-- 球场线 -->
  <path d="M24 210 H296" stroke="#FFD166" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <!-- 人物整体轻微跳动 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0;0 -5;0 0" keyTimes="0;0.5;1" dur="0.95s"
                      repeatCount="indefinite" calcMode="spline"
                      keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>

    <!-- 腿 -->
    <path d="M98 168 L94 196" stroke="#2B2B2B" stroke-width="10" stroke-linecap="round"/>
    <path d="M128 168 L132 196" stroke="#2B2B2B" stroke-width="10" stroke-linecap="round"/>

    <!-- 鞋 -->
    <ellipse cx="92" cy="198" rx="12" ry="5" fill="#333333"/>
    <ellipse cx="134" cy="198" rx="12" ry="5" fill="#333333"/>

    <!-- 白 T 恤 -->
    <path d="M90 120 Q112 108 134 120 L140 170 Q112 180 84 170 Z"
          fill="url(#shirtGrad)" stroke="#E5E5E5" stroke-width="2"/>

    <!-- 背带裤 -->
    <path d="M86 146 Q112 140 138 146 L136 174 Q112 182 88 174 Z" fill="#2B2B2B"/>
    <path d="M96 118 L100 148 M128 118 L124 148"
          stroke="#2B2B2B" stroke-width="6" stroke-linecap="round"/>
    <rect x="104" y="154" width="16" height="10" rx="3" fill="#3A3A3A"/>

    <!-- 左臂 -->
    <path d="M90 132 Q76 148 80 162"
          fill="none" stroke="#FFE0BD" stroke-width="9" stroke-linecap="round"/>
    <circle cx="80" cy="164" r="5.5" fill="#FFE0BD"/>

    <!-- 右臂伸向篮球 -->
    <path d="M134 132 Q162 124 190 138"
          fill="none" stroke="#FFE0BD" stroke-width="9" stroke-linecap="round"/>
    <circle cx="192" cy="140" r="6" fill="#FFE0BD"/>

    <!-- 头 -->
    <circle cx="112" cy="84" r="30" fill="#FFE0BD"/>

    <!-- 中分头 -->
    <path d="M82 86 Q80 52 112 50 Q106 62 101 76 Q92 82 82 86 Z" fill="#1F1F1F"/>
    <path d="M142 86 Q144 52 112 50 Q118 62 123 76 Q132 82 142 86 Z" fill="#1F1F1F"/>

    <!-- 眼睛 -->
    <circle cx="102" cy="88" r="3" fill="#222222"/>
    <circle cx="124" cy="88" r="3" fill="#222222"/>
    <circle cx="101" cy="87" r="1" fill="#FFFFFF"/>
    <circle cx="123" cy="87" r="1" fill="#FFFFFF"/>

    <!-- 腮红 -->
    <ellipse cx="94" cy="96" rx="6" ry="3" fill="#FF9AA2" opacity="0.6"/>
    <ellipse cx="130" cy="96" rx="6" ry="3" fill="#FF9AA2" opacity="0.6"/>

    <!-- 嘴 -->
    <path d="M108 98 Q112 102 116 98"
          fill="none" stroke="#B5654A" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 篮球阴影：随弹跳缩放 -->
  <ellipse cx="232" cy="198" rx="22" ry="5" fill="#000" opacity="0.14">
    <animate attributeName="rx" values="22;14;22" keyTimes="0;0.5;1" dur="0.95s"
             repeatCount="indefinite" calcMode="spline"
             keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="opacity" values="0.14;0.07;0.14" keyTimes="0;0.5;1" dur="0.95s"
             repeatCount="indefinite" calcMode="spline"
             keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </ellipse>

  <!-- 篮球弹跳 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0;0 -54;0 0" keyTimes="0;0.5;1" dur="0.95s"
                      repeatCount="indefinite" calcMode="spline"
                      keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>

    <!-- 篮球旋转 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0 232 170;360 232 170" dur="0.95s"
                        repeatCount="indefinite"/>

      <circle cx="232" cy="170" r="24" fill="url(#ballGrad)"
              stroke="#B45309" stroke-width="2"/>

      <!-- 篮球纹路 -->
      <path d="M208 170 H256 M232 146 V194
               M214 152 Q232 170 214 188
               M250 152 Q232 170 250 188"
            fill="none" stroke="#7C2D12" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
